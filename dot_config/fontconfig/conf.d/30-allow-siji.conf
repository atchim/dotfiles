<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Allow siji (bitmap PCF) to be rendered despite Gentoo's system-wide
  70-no-bitmaps-except-emoji.conf. siji is the polybar status-bar font
  of choice; its U+E0xx glyphs read crisper at small sizes than vector
  equivalents.
-->
<fontconfig>
  <selectfont>
    <acceptfont>
      <pattern>
        <patelt name="family">
          <string>Wuncon Siji</string>
        </patelt>
      </pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
