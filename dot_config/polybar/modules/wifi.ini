[module/wifi]
type = internal/network
interface = ${env:WIFI}
interval = 4

format-connected = <ramp-signal>

ramp-signal-0 = 
ramp-signal-0-foreground = ${oil8.english-red}
ramp-signal-1 = 
ramp-signal-1-foreground = ${oil8.macaroni-and-cheese}
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 

format-disconnected = <label-disconnected>
label-disconnected = 
label-disconnected-foreground = ${oil8.english-red}

click-left = polybar-notify wifi
