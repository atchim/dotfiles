[module/volume]
type = internal/alsa
master-mixer = Master
interval = 5

format-volume = <ramp-volume>
format-muted = <label-muted>
label-muted = 
label-muted-foreground = ${oil8.cyber-grape}

ramp-volume-0 = 
ramp-volume-0-foreground = ${oil8.cyber-grape}
ramp-volume-1 = 
ramp-volume-2 = 

click-left = polybar-notify volume
