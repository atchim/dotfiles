[module/volume]
type = internal/alsa
master-mixer = Master
interval = 5

format-volume = <ramp-volume>
format-muted = <label-muted>
label-muted = 
label-muted-foreground = ${oil8.cyber-grape}

; ALSA's volume is linear in the raw mixer register, but the percentage
; alsamixer shows is logarithmic, like human hearing — so equal-weight
; icons bunch up at the bottom: icon 0 covered only the 1%–6% slice that
; alsamixer displays. The weights below spread the five icons over even
; 20% bands of alsamixer's scale; each weight is the raw-register width
; (%) of its band, so they sum to 100.
; SEE: dot_local/bin/executable_audio-jack-monitor (Volume Scale).

ramp-volume-0 = 
ramp-volume-0-foreground = ${oil8.cyber-grape}
ramp-volume-0-weight = 47
ramp-volume-1 = 
ramp-volume-1-weight = 21
ramp-volume-2 = 
ramp-volume-2-weight = 14
ramp-volume-3 = 
ramp-volume-3-weight = 10
ramp-volume-4 = 
ramp-volume-4-foreground = ${oil8.brink-pink}
ramp-volume-4-weight = 8

; internal/alsa owns left-click (mute toggle), so notify is on right.
click-right = polybar-notify volume
