[module/volume]
type = internal/pulseaudio
; No `sink` -> follow the default sink (WirePlumber picks/persists it).
use-ui-max = false
interval = 5

format-volume = <ramp-volume>
format-muted = <label-muted>
label-muted =
label-muted-foreground = ${oil8.cyber-grape}

; internal/pulseaudio reports the default-sink volume as a ~linear
; percentage (100% = 0 dB), so the five icons spread evenly over the range
; — none of the raw-register linearization weights the old internal/alsa
; module needed.
ramp-volume-0 =
ramp-volume-0-foreground = ${oil8.cyber-grape}
ramp-volume-1 =
ramp-volume-2 =
ramp-volume-3 =
ramp-volume-4 =
ramp-volume-4-foreground = ${oil8.brink-pink}

; left-click toggles mute on the default sink (internal/pulseaudio doesn't
; hardcode a mute click); right-click shows the reading. Scroll adjusts
; volume via the module's built-in.
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = polybar-notify volume
