[module/battery]
type = internal/battery
battery = ${env:BAT}
adapter = ${env:ADAPTER}
full-at = 99
low-at = 15
poll-interval = 5

format-charging = 
format-charging-foreground = ${oil8.mantis}
format-discharging = <ramp-capacity>
format-full = <ramp-capacity>
format-full-foreground = ${oil8.mantis}
format-low = <animation-low>

; siji has only three battery fill glyphs (empty, 1/3, 2/3) and no
; brim-full one, so the capacity ramp is three icons. Weights keep the
; empty/alert glyph just above low-at and let the healthy glyph hold the
; whole top; format-low (below) replaces the ramp entirely under low-at.
ramp-capacity-0 = 
ramp-capacity-0-foreground = ${oil8.brink-pink}
ramp-capacity-0-weight = 20
ramp-capacity-1 = 
ramp-capacity-1-foreground = ${oil8.bone}
ramp-capacity-1-weight = 35
ramp-capacity-2 = 
ramp-capacity-2-weight = 45

animation-low-0 = 
animation-low-0-foreground = ${oil8.brink-pink}
animation-low-1 = 
animation-low-1-foreground = ${oil8.caput-mortuum}
animation-low-framerate = 500
