[module/battery]
type = internal/battery
battery = ${env:BAT}
adapter = ${env:ADAPTER}
full-at = 99
low-at = 10
poll-interval = 5

format-charging = 
format-charging-suffix-foreground = ${oil8.chinese-green}

format-discharging = <ramp-capacity>
format-full = <ramp-capacity>
format-low = <animation-low>

ramp-capacity-0 = 
ramp-capacity-0-foreground = ${oil8.english-red}
ramp-capacity-1 = 
ramp-capacity-1-foreground = ${oil8.macaroni-and-cheese}
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-4-foreground = ${oil8.chinese-green}

animation-low-0 = 
animation-low-0-foreground = ${oil8.english-red}
animation-low-1 = 
animation-low-1-foreground = ${oil8.eerie-black}
animation-low-framerate = 500

click-left = polybar-notify battery
