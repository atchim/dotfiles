[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT}

; Scroll writes ${card}/brightness directly. Two prerequisites live outside
; this file:
;   1. Non-root write needs that sysfs file group-writable by `video`. A system
;      udev rule (/etc/udev/rules.d/70-backlight-video.rules: chgrp video +
;      chmod g+w on ACTION==add) grants it — machine state, deliberately not
;      tracked in this repo.
;   2. use-actual-brightness = false: on amdgpu the kernel's actual_brightness
;      follows a nonlinear curve far below the brightness setpoint we write, so
;      polybar's default (true, forced on amdgpu since 3.7.0) reads a lower base
;      than it writes — a +5% scroll lands *below* the current setpoint, dimming
;      the screen whether you scroll up or down. Reading brightness (the file we
;      write) keeps the scroll base and target on one scale. polybar-notify also
;      reads brightness, so the click readout now matches the ramp.
use-actual-brightness = false
enable-scroll = true

format = <ramp>

ramp-0 = 
ramp-0-foreground = ${oil8.brink-pink}
ramp-1 = 
ramp-2 = 

click-left = polybar-notify backlight
