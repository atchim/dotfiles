[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT}

; Scroll is handled by polybar-backlight, not by the module. Three things this
; module depends on, none of them obvious:
;   1. Non-root write needs ${card}/brightness group-writable by `video`. A
;      system udev rule (/etc/udev/rules.d/70-backlight-video.rules: chgrp video
;      + chmod g+w on ACTION==add) grants it — machine state, deliberately not
;      tracked in this repo; recovery recipe lives in kslop
;      hardware/avell-storm-450-r7-8745hs/system-config.md. The rule matches
;      KERNEL=="amdgpu_bl*", not a literal name: amdgpu names the device after
;      the DRM card index, so it is amdgpu_bl1 in the default boot profile and
;      amdgpu_bl0 in the suspend-safe one (kslop ADR-0007).
;   2. enable-scroll = false, and every mouse action lives inside `format` as
;      an %{A} action tag. Two independent reasons pile up here. First, the
;      module's internal scroll writes a percentage of max_brightness, and on
;      kernel 7.1 amdgpu advertises a max whose top values wrap the panel's PWM
;      register and black the display out — recovering needs a root write — so
;      the write moves to polybar-backlight, which clamps (ADR-0007). Second,
;      the module-level click-*/scroll-* keys never reach this module: measured
;      on 3.7.2, internal/backlight ignores all five buttons bound that way,
;      while %{A} tags in `format` fire every one. Those keys are only
;      dependable on custom/* modules — the same reason battery and wifi never
;      got a working click-left. Measurements in polybar/CONVENTIONS.md.
;   3. use-actual-brightness = false: on amdgpu the kernel's actual_brightness
;      follows a nonlinear curve that diverges from the brightness setpoint we
;      write (below it through most of the range; at a wrapped setpoint it reads
;      0 outright), so polybar's default (true, forced on amdgpu since 3.7.0)
;      reads a different base than it writes — a +5% scroll lands *below* the
;      current setpoint, dimming the screen whether you scroll up or down.
;      Reading brightness (the file we write) keeps base and target on one
;      scale. polybar-notify also reads brightness, and divides it by
;      `polybar-backlight ceiling` rather than max_brightness, so its readout
;      is on that same scale too and a clamped-full panel reads 100%.
use-actual-brightness = false
enable-scroll = false

; A1 = left click, A4 = scroll up, A5 = scroll down. Commands must not
; contain a colon — polybar's action tags terminate on one.
format = %{A1:polybar-notify backlight:}%{A4:polybar-backlight up:}%{A5:polybar-backlight down:}<ramp>%{A}%{A}%{A}

ramp-0 = 
ramp-0-foreground = ${oil8.brink-pink}
ramp-1 = 
ramp-2 = 
