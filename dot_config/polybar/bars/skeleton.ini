; Oil 8 Palette
; -------------

include-file = ~/.local/share/oil8/polybar/oil8.ini

; Modules
; -------

include-file = ~/.config/polybar/modules/backlight.ini
include-file = ~/.config/polybar/modules/battery.ini
include-file = ~/.config/polybar/modules/bspwm.ini
include-file = ~/.config/polybar/modules/cpu.ini
include-file = ~/.config/polybar/modules/date.ini
include-file = ~/.config/polybar/modules/tray.ini
include-file = ~/.config/polybar/modules/volume.ini
include-file = ~/.config/polybar/modules/wifi.ini

; Bar Skeleton
; ------------

; Common chassis every real bar inherits via `inherit = bar/skeleton`. Holds
; visual identity (font stack, colours, padding) but not geometry or module
; lists — those live in each `bars/<name>.ini`.
[bar/skeleton]
background = ${oil8.eerie-black}
foreground = ${oil8.bone}

border-size = 0
cursor-click = pointer
cursor-scroll = ns-resize

; siji's upstream family name is "Wuncon Siji". Listed first so its U+E0xx
; bitmaps render before Nerd Font's vector fallback.
font-0 = Wuncon Siji:pixelsize=10;1
font-1 = Hack Nerd Font Mono:pixelsize=10;1

padding-left = 1
padding-right = 1
module-margin = 1

enable-ipc = true
