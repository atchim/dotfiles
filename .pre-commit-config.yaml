default_install_hook_types:
  - pre-commit
  - commit-msg
exclude: \.toml\.snap$
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
      - id: shfmt
        name: shfmt (Bash config files)
        files: ^dot_bash(rc|_profile)$
        types: []
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.8.3
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args: [--no-schema]
  - repo: local
    hooks:
      - &shellcheck-base
        id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]
      - <<: *shellcheck-base
        name: ShellCheck (Bash config files)
        args: ['--shell=bash']
        files: ^dot_bash(rc|_profile)$
        types: []
      - &shellharden-base
        id: shellharden
        name: Shellharden
        entry: shellharden
        args: ['--check']
        language: system
        types: [shell]
      - <<: *shellharden-base
        name: Shellharden (Bash config files)
        files: ^dot_bash(rc|_profile)$
        types: []
      - id: fish-indent
        name: fish_indent
        entry: fish_indent --check
        language: system
        types: [fish]
      - id: fish-syntax
        name: fish -n
        entry: fish -n
        language: system
        types: [fish]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--ignore-words-list, 'edn,esy']
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
